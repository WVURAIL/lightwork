# The LightWork Memo series.
#
# The numbers here are the memo numbers, not positions in a list. The series
# has gaps -- there is no memo 5, 7, 11, 12, 13 or 17 -- and it used to be kept
# as a hand-numbered Markdown list in README.md, where the gaps were written as
# bare `5.` and `7.` lines. Markdown reads a lone numeral on its own line as
# continuation text, so it rendered those into the end of the previous memo's
# description ("...first working horn antenna. 5.") and then renumbered the
# whole list 1..32, at which point no number on the page matched the memo it
# labelled.
#
# README.md is generated from this file by bin/build_readme.py, so the two
# cannot disagree; CI fails if it is out of date. To add a memo: add an entry
# here, run the script, commit both.
#
# status:
#   active     -- published and current
#   draft      -- circulated but marked under construction by its author
#   superseded -- replaced by a later memo; keep it, say so
#   announced  -- numbered and named, no PDF yet. Deliberately not a link:
#                 a link in the index is a promise the file is there, and an
#                 announced memo published as a link is how 037 reached the
#                 live site as a dead one.

